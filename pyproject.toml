[project]
name = "clear"
version = "0.1.0"
description = "CLEAR: Climate Policy Retrieval and Summarization Using LLMs"
authors = [
    { name = "Yutao Wu", email = "oscar.w@deakin.edu.au" },
]
dependencies = [
    "openai==1.54.3",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pdf2image>=1.17.0",
    "pypdf>=6.19.0",
    "requests>=2.33.0",
    "rich>=13.9.4",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.0",
    "rapidfuzz>=3.10.1",
]
requires-python = ">=3.10"

[project.optional-dependencies]
model = [
    "torch>=2.13.0",
    "transformers>=5.10.0",
]
train = [
    "datasets>=5.0.1",
    "hf-transfer>=0.1.8",
    "peft>=0.13.2",
    "torch>=2.13.0",
    "transformers>=5.10.0",
    "trl>=0.21.0",
    "unsloth",
]

[tool.uv.sources]
unsloth = { git = "https://github.com/unslothai/unsloth.git" }

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "aiohttp>=3.14.3",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "accelerate>=1.15.0",
    "fsspec>=2026.6.0",
    "urllib3>=2.8.0",
]
